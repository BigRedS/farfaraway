apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: feed-fiddler
resources:
  - _namespace.yaml
  - github.com/BigRedS/feed-fiddler//deploy/k8s/base?ref=main
  - ingress.yaml

configMapGenerator:
  - name: feed-fiddler-config
    behavior: replace
    files:
      - feeds.yaml=feeds.k8s.yaml

patches:
  - path: cronjob-patch.yaml
